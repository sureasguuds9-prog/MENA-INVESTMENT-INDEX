services:
  - type: web
    name: mena-investment-index
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:server --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ACLED_EMAIL
        sync: false   # заполнить вручную в Render dashboard
      - key: ACLED_KEY
        sync: false
    plan: free
    healthCheckPath: /
